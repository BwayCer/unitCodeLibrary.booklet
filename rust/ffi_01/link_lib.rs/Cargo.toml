[package]
name = "link_lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "ffi_test"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "test_lib"
path = "./src/main.rs"
required-features = ["bin-main"]

[[bin]]
name = "generate_headers"
required-features = ["headers"]

[dependencies]
clap = { version = "4.5.35", features = ["derive"] }
rand = "0.9.0"
safer-ffi = "0.1.13"
sysinfo = "0.34.2"

[features]
bin-main = []
headers = ["safer-ffi/headers"]
